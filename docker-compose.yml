services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders?schema=public
      PORT: 3001
      LEASE_TIMEOUT_SECONDS: 120
      MAX_RETRIES: 3
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  postgres_data:
